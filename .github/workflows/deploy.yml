name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  schedule:
    # Har 30 daqiqada Telegram kanaldagi yangi postlarni saytga olib kelish
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Telegram kanal postlarini olish
        run: node scripts/fetch-telegram-news.mjs

      - name: Telegram videolar keshi
        uses: actions/cache@v4
        with:
          path: public/tg-videos
          key: tg-videos-${{ github.run_id }}
          restore-keys: tg-videos-

      - name: Oxirgi 3 ta videoni saytga yuklash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          npm install --no-save --legacy-peer-deps telegram@2.26.22 || true
          node scripts/fetch-telegram-videos.mjs

      - name: Admin login-parol (GitHub Secrets)
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/admin-hash.mjs >> "$GITHUB_ENV"

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
